io_format: ndjson
description: |
  Newline-delimited JSON format (NDJSON).
  Standard format for ingest → infer → aggregate → evaluate pipeline.
  One JSON object per line, optimized for streaming and line-by-line processing.

# Adapter module names (loaded dynamically)
reader: ndjson_example_reader
reader_module_path: llm_ensemble.infer.adapters.io.ndjson_example_reader.NdjsonExampleReader
writer: ndjson_judgement_writer
writer_module_path: llm_ensemble.infer.adapters.io.ndjson_judgement_writer.NdjsonJudgementWriter
