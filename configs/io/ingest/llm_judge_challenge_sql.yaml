name_hint: llmjudge-sql
description: |
  LLM Judge Challenge 2024 raw dataset format with SQL persistence.
  Reads from TSV queries, JSONL documents, and TSV qrels files.
  Writes judging samples to SQL database (SQLite or PostgreSQL).
  Used by ingest CLI for dataset normalization with database persistence.

# Adapter specifications (loaded dynamically)
# Format: module paths are snake_case, class names are UpperCamelCase
reader_module: llm_ensemble.ingest.adapters.io.llm_judge_dataset_reader
reader_class: LLMJudgeDatasetReader
writer_module: llm_ensemble.ingest.adapters.io.sql_writer
writer_class: SqlWriter
