name_hint: sql
description: |
  SQL database format for infer CLI.
  Reads JudgingSample records from PostgreSQL database by ingest run name.
  Writes LLMJudgement records to SQL database with normalized schema.

  Usage: --io sql --input <ingest_run_name>

  Requires DATABASE_URL environment variable (loaded from .env).

# Adapter specifications (loaded dynamically)
# Format: module paths are snake_case, class names are UpperCamelCase
reader_module: llm_ensemble.infer.adapters.io.db_judged_dataset_reader
reader_class: DbJudgedDatasetReader
writer_module: llm_ensemble.infer.adapters.io.sql_judgement_writer
writer_class: SqlJudgementWriter
