name_hint: llmjudge-json
description: |
  LLM Judge Challenge 2024 raw dataset format with JSON output.
  Reads from TSV queries, JSONL documents, and TSV qrels files.
  Writes judging samples to a single JSON array (fully populated).
  Used by ingest CLI for dataset normalization.

# Adapter specifications (loaded dynamically)
# Format: module paths are snake_case, class names are UpperCamelCase
reader_module: llm_ensemble.ingest.adapters.io.llm_judge_dataset_reader
reader_class: LLMJudgeDatasetReader
writer_module: llm_ensemble.ingest.adapters.io.fully_populated_json_writer
writer_class: FullyPopulatedJsonWriter
