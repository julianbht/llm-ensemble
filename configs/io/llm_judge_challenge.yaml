io_format: llm_judge_ingest
description: |
  LLM Judge Challenge 2024 raw dataset format.
  Reads from TSV queries, JSONL documents, and TSV qrels files.
  Writes judging samples (each with manifest reference) to NDJSON format.
  Used by ingest CLI for dataset normalization.

# Ingest-specific fields
dataset_id: llm-judge-challenge-2024

# Adapter module names (loaded dynamically)
reader: llm_judge_sample_reader
reader_module_path: llm_ensemble.ingest.adapters.io.llm_judge_sample_reader.LlmJudgeSampleReader
writer: fully_populated_ndjson_writer
writer_module_path: llm_ensemble.ingest.adapters.io.ndjson_dataset_writer.FullyPopulatedNdjsonWriter
