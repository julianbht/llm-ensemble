model_id: phi3-mini
provider: hf
name_hint: phi3
context_window: 4096

# Adapter specifications (loaded dynamically)
# Format: module paths are snake_case, class names are UpperCamelCase
provider_module: llm_ensemble.infer.adapters.providers.huggingface_adapter
provider_class: HuggingFaceAdapter

# Core inference parameters
temperature: 0.0
max_tokens: 256

# Advanced parameters
additional_params: {}

# Model capabilities
capabilities:
  multilingual: true

# HuggingFace configuration
# Use hf_model_name for public Inference API, or hf_endpoint_url for dedicated endpoints
hf_model_name: microsoft/Phi-3-mini-4k-instruct
# hf_endpoint_url: https://your-endpoint.aws.endpoints.huggingface.cloud
