# Standard retry configuration for LLM provider API calls
#
# This configuration defines exponential backoff behavior, request timeouts,
# and retryable errors for LLM providers (e.g., OpenRouter, Ollama, HuggingFace).
#
# Retry Strategy:
# - Delay increases exponentially: base_delay × 2^attempt
# - Capped at max_delay to prevent excessively long waits
# - 10% random jitter added to prevent thundering herd
#
# Example delays: 1s → 2s → 4s → 8s → 16s → 32s (capped at 60s)

# Maximum number of retry attempts before failing
# Total attempts = max_retries + 1 (initial attempt + retries)
max_retries: 7

# Initial delay in seconds before first retry
# Exponential backoff: delay = base_delay × 2^attempt
base_delay_seconds: 2

# Maximum delay cap in seconds
# Prevents excessively long waits in later retries
max_delay_seconds: 160

# Maximum time to wait for a single API request (in seconds)
# If a request takes longer than this, it will timeout and potentially retry
# Note: This is per-request timeout, not total timeout for all retries
request_timeout_seconds: 160

# HTTP status codes that trigger retries
# 429: Rate Limit Exceeded (most common)
# 503: Service Unavailable (temporary server issues)
# 504: Gateway Timeout (upstream timeout)
retryable_status_codes:
  - 429
  - 503
  - 504
