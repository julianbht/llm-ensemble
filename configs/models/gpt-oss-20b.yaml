model_id: gpt-oss-20b
provider: openrouter
name_hint: gpt20b
context_window: 8192

# Adapter specifications (loaded dynamically)
# Format: module paths are snake_case, class names are UpperCamelCase
provider_module: llm_ensemble.infer.adapters.providers.openrouter_adapter
provider_class: OpenRouterAdapter

# Core inference parameters (explicit for discoverability)
temperature: 0.0
max_tokens: 256
seed: 42  # For reproducibility

# Output control
response_format:
  type: json_object  # Force structured JSON output

# Advanced parameters (if needed)
additional_params: {}

# Model capabilities
capabilities:
  multilingual: true

# OpenRouter configuration
openrouter_model_id: openai/gpt-oss-20b:free
