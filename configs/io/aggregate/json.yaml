# JSON I/O configuration for aggregate CLI
# Reads LLMJudgement records, writes AggregatedJudgement records as JSON arrays

reader:
  module: llm_ensemble.aggregate.adapters.io.json_judgement_reader
  class: JsonJudgementReader

writer:
  module: llm_ensemble.aggregate.adapters.io.json_aggregated_judgement_writer
  class: JsonAggregatedJudgementWriter
