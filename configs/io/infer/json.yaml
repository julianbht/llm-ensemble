name_hint: json
description: |
  JSON array format for infer CLI.
  Reads JudgingSample records from a single JSON array (output from ingest CLI).
  Writes LLMJudgement records to a single JSON array (output from infer CLI).
  Note: Accumulates all data in memory - use NDJSON for very large datasets.

# Adapter specifications (loaded dynamically)
# Format: module paths are snake_case, class names are UpperCamelCase
reader_module: llm_ensemble.infer.adapters.io.fully_populated_json_reader
reader_class: FullyPopulatedJsonReader
writer_module: llm_ensemble.infer.adapters.io.fully_populated_json_writer
writer_class: FullyPopulatedJsonWriter
